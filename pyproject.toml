[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "xinml"
version = "0.1.0"
description = "Machine learning from scratch for CMOR 438 / INDE 577 at Rice University."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "ipykernel>=6",
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xinml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
